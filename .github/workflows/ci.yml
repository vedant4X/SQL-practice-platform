name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npx tsc --noEmit

      - name: Run Unit & API Tests
        run: npm run test

      - name: Run SQL Sandbox Security Test Suite
        run: npm run test:security

      - name: Run Question Bank Content Validation
        run: npm run test:content
